<!doctype html>
<!-- data-theme is set here, not only by the script below, so the first paint
     is the default theme even if the script is delayed or blocked. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SECH_LIMS by Nickland</title>
  <!-- Progressive Web App: installable on desktop and mobile, served over the LAN. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0A1322" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SECH_LIMS" />
  <!-- The stored theme is applied before the first paint, so the splash and the
       application never flash the wrong background. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sechlims.theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0A1322' : '#FFFFFF');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    /* Dark is the default, so it is the base here too: an installation that has
       never chosen a theme boots on the same colour the Electron window and the
       web manifest already paint, with no white flash between them. */
    :root {
      --boot-bg: radial-gradient(1000px 640px at 50% -12%, rgba(47,107,255,0.18), transparent 60%),
                 linear-gradient(160deg, #0A1322 0%, #060A14 100%);
      --boot-text: #F5F8FF;
      --boot-muted: #A8B3C7;
      --boot-faint: #5A6680;
      --boot-panel: #122038;
      --boot-track: rgba(78,141,255,0.18);
    }
    /* Matches the application's light workspace, so for someone who has chosen
       light the splash and the first painted screen are the same colour. */
    :root[data-theme="light"] {
      --boot-bg: radial-gradient(900px 560px at 50% -14%, rgba(47,107,255,0.10), transparent 62%),
                 linear-gradient(170deg, #EEF1F8 0%, #DCE3F0 100%);
      --boot-text: #0B1524;
      --boot-muted: #495872;
      --boot-faint: #6C7B94;
      --boot-panel: #E4EAF3;
      --boot-track: rgba(47,107,255,0.22);
    }
    html, body, #root { min-height: 100vh; margin: 0; }
    body {
      background: var(--boot-bg);
      color: var(--boot-text);
      font-family: Inter, "Segoe UI", system-ui, Arial, sans-serif;
    }
    #boot-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
    }
    #boot-splash .mark {
      width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
      background: linear-gradient(140deg, #2F6BFF, #1B49C0);
      box-shadow: 0 10px 30px rgba(47,107,255,0.45); color: #fff;
    }
    #boot-splash .title { font-size: 26px; font-weight: 700; letter-spacing: 0.02em; }
    #boot-splash .sub { font-size: 13px; color: var(--boot-muted); margin-top: -8px; }
    #boot-splash .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--boot-track); border-top-color: #2F6BFF;
      animation: spin 0.8s linear infinite; margin-top: 6px;
    }
    #boot-splash .status { font-size: 13.5px; color: var(--boot-muted); }
    #boot-splash .diag { font-size: 11.5px; color: var(--boot-faint); max-width: 460px; line-height: 1.5; margin-top: 10px; }
    #boot-splash .diag code { background: var(--boot-panel); color: #2F6BFF; padding: 2px 6px; border-radius: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot-splash">
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3h6"/><path d="M10 3v6.5L5.2 17a2 2 0 0 0 1.7 3h10.2a2 2 0 0 0 1.7-3L14 9.5V3"/><path d="M7.5 14h9"/>
        </svg>
      </div>
      <div>
        <div class="title">SECH_LIMS</div>
        <div class="sub">by Nickland</div>
      </div>
      <div class="spinner"></div>
      <div class="status">Starting your laboratory workspace…</div>
      <div class="diag">
        If this screen stays for more than a minute, open <strong>View &rarr; Toggle Developer Tools</strong>.
        Boot diagnostics are written to <code>%APPDATA%\sech-lims-by-nickland\boot.log</code>.
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
