name: Build Android APK

# Builds an installable Android APK for the SECH_LIMS Staff Companion and
# publishes it so staff can install straight from GitHub — no Play Store needed.
#
#  - Runs on a published GitHub Release (attaches the APK to that release) and on
#    manual dispatch (uploads it as a workflow artifact).
#  - With no configuration it builds a debug-signed APK, which installs fine for
#    internal/side-load distribution.
#  - To ship a release-signed APK, add these repository secrets:
#      ANDROID_KEYSTORE_BASE64     base64 of your upload keystore (.jks)
#      ANDROID_KEYSTORE_PASSWORD   keystore password
#      ANDROID_KEY_ALIAS           key alias
#      ANDROID_KEY_PASSWORD        key password
#    Create a keystore once with:
#      keytool -genkey -v -keystore upload.jks -keyalg RSA -keysize 2048 \
#        -validity 10000 -alias sechlims
#      base64 -w0 upload.jks        # paste into ANDROID_KEYSTORE_BASE64

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-apk:
    name: Build SECH_LIMS Staff APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        # --ignore-scripts skips the Electron binary download and native rebuilds
        # (better-sqlite3) that the mobile build does not need.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build mobile web bundle
        run: npm run build:mobile

      - name: Add Android platform
        run: '[ -d android ] || npx --no-install cap add android'

      - name: Sync web assets into the Android project
        run: npx --no-install cap sync android

      - name: Decode signing keystore (if configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set — building a debug-signed APK (installable for side-load)."
          fi

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/upload.jks" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Name the APK
        run: cp "$APK_PATH" "SECH_LIMS-Staff.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SECH_LIMS-Staff-APK
          path: SECH_LIMS-Staff.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: SECH_LIMS-Staff.apk
