name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # Nothing is packaged until the verification suite has passed. An installer
  # built from a build that failed its own checks is worse than no installer:
  # somebody will deploy it (validation finding VF-22).
  verify:
    uses: ./.github/workflows/verify.yml

  build-windows-installer:
    name: Build SECH_LIMS Windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Force node-gyp to use the Visual Studio toolchain that ships on the
      # windows-latest runner.
      GYP_MSVS_VERSION: '2022'
      # No code signing for unsigned internal builds.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder reads GH_TOKEN to attach to releases. This workflow
      # only uploads as an artifact, so an empty value is fine.
      GH_TOKEN: ''
      # Stamp which commit this installer was built from, so a deployed
      # installation can be tied back to its source (validation finding VF-11).
      SECH_LIMS_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Smoke check
        shell: bash
        run: |
          if npm run | grep -q '^  smoke$'; then
            npm run smoke
          else
            echo "smoke script not defined; skipping"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build client and Electron bundle
        run: npm run build

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Build Windows installer (electron-builder)
        run: npm run dist:win

      - name: List release output
        if: always()
        shell: bash
        run: |
          echo "Release folder contents:"
          ls -la release || true

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SECH_LIMS_Windows_Installer
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 14
