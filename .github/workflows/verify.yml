name: Verify

# Everything that has to be true before a build is worth packaging.
#
# Originally written in August 2026 to close validation finding VF-22: until
# then the only checks that ran in CI were a typecheck and a structure check,
# inside the Windows installer job, so the RBAC, IQC, alerts, account and backup
# scripts were exercised only when somebody remembered to run them by hand. That
# workflow was never merged to the default branch, so between August and
# November nothing ran on any push at all. This is it restored, with two
# changes:
#
#   • The unit-test step is gone. It ran `vitest`, which lives on the branch
#     that workflow came from and not on this one. A step that cannot run is
#     worse than no step: it fails every build for a reason that is not about
#     the build.
#
#   • The analyser and middleware suites are added. They did not exist in
#     August, and they are now the largest body of safety-critical behaviour in
#     the system — a result filed against the wrong patient or in the wrong
#     field is the failure this laboratory cannot absorb.
#
# The split between the two jobs is deliberate. `verify` is the gate: every
# step in it passes today, so red means somebody broke something. `survey`
# reports the things that are known to be outstanding — the qualification
# protocol and the dependency advisories — which must stay visible without
# blocking every push on work nobody has done yet. A gate that is always red
# teaches people to ignore the gate.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:      # so the installer workflows can require this one first

jobs:
  verify:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Structure check
        run: npm run smoke

      - name: Build
        run: npm run build
        env:
          SECH_LIMS_BUILD_COMMIT: ${{ github.sha }}
          SECH_LIMS_BUILD_DATE: ${{ github.event.repository.updated_at }}

      # Performance qualification: backup and recovery. Passes today, so it
      # gates. Its sibling, the operational qualification, does not — see the
      # survey job.
      - name: Performance qualification (backup and recovery)
        run: npm run validate:pq

      # Checks that start no host of their own.
      - name: In-process checks
        run: |
          set -e
          npm run check:backup-scheduler
          npm run check:backup-destinations
          npx tsx scripts/humastar-folder-check.mjs

      # The verification scripts that need a live host.
      #
      # Each gets its OWN host on its own scratch directory and its own port.
      # Sharing one host between suites looks cheaper and is not: these scripts
      # revoke permissions, retire links and seed control lots, so a suite can
      # pass alone and fail after another has run, which is a failure about the
      # order the scripts ran in rather than about the software. The one
      # deliberate exception is the rbac trio, where rbac-roles seeds the probe
      # users the other two read (validation finding VF-23).
      - name: Verification scripts
        run: |
          set -e
          start_host() {
            rm -rf "/tmp/ci-$1" && mkdir -p "/tmp/ci-$1"
            SECH_LIMS_DATA_DIR="/tmp/ci-$1" API_PORT="$2" SECH_LIMS_API_HOST=127.0.0.1 \
              node_modules/.bin/tsx server/index.ts > "/tmp/ci-$1.log" 2>&1 &
            echo $! > "/tmp/ci-$1.pid"
            for _ in $(seq 1 60); do
              curl -sf "http://127.0.0.1:$2/api/health" >/dev/null && return 0
              sleep 1
            done
            echo "host $1 did not start"; cat "/tmp/ci-$1.log"; return 1
          }
          stop_host() { kill "$(cat "/tmp/ci-$1.pid")" 2>/dev/null || true; }

          run_alone() {  # name port script [runner]
            echo "::group::$3"
            start_host "$1" "$2"
            API="http://127.0.0.1:$2/api" ${4:-node} "$3"
            stop_host "$1"
            echo "::endgroup::"
          }

          # Access, accounts and the quality-control record.
          run_alone rbac    4399 scripts/rbac-check.mjs
          run_alone account 4420 scripts/account-check.mjs
          run_alone iqc     4430 scripts/iqc-check.mjs
          run_alone iqcio   4434 scripts/iqc-io-check.mjs
          run_alone iqcadm  4432 scripts/iqc-admin-check.mjs
          run_alone alerts  4431 scripts/alerts-check.mjs "node_modules/.bin/tsx"
          run_alone backup  4433 scripts/backup-check.mjs "node_modules/.bin/tsx"

          # Analyser transmission, the middleware and the result filler. A
          # reading taken from the wrong field, or filed against the wrong
          # patient, is what these exist to catch.
          run_alone bridge  4460 scripts/instrument-bridge-check.mjs
          run_alone ifetch  4461 scripts/instrument-fetch-check.mjs
          run_alone mware   4462 scripts/middleware-check.mjs
          run_alone pmap    4463 scripts/parameter-mappings-check.mjs
          run_alone rfill   4464 scripts/result-filler-check.mjs
          run_alone lhims   4465 scripts/lhims-bridge-check.mjs
          run_alone iqcana  4466 scripts/iqc-analyser-check.mjs

          # These three share one host: rbac-roles seeds the probe users the
          # other two read.
          echo "::group::rbac trio"
          start_host chain 4405
          API=http://127.0.0.1:4405/api node scripts/rbac-roles.mjs
          API=http://127.0.0.1:4405/api node scripts/rbac-matrix.mjs
          API=http://127.0.0.1:4405/api node scripts/rbac-selfservice.mjs
          stop_host chain
          echo "::endgroup::"

  survey:
    name: Known outstanding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never blocks a push. What it reports is real and is on the record in
    # docs/validation; none of it is a regression anybody introduced today.
    #
    # The flag is on the job AND on each step, which is not redundant: the job
    # flag stops a failure here failing the run, but a failing step still ends
    # the job, which skipped both audits the first time this ran. A job whose
    # whole purpose is to report has to reach the end of its own list.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The operational qualification measures this build against the
      # requirements baseline NSD-SRS-001. It currently fails OQ-6.1 to 6.3 —
      # electronic signatures — because that work sits on a branch that was
      # never merged. Reported every run so the gap cannot be forgotten; not a
      # gate, because no change to this branch can close it.
      - name: Operational qualification
        continue-on-error: true
        run: npm run validate:oq

      # A critical advisory in code that actually ships is a real finding and is
      # recorded as an open item in the validation package (xlsx: prototype
      # pollution and ReDoS, with no fixed release). It is surfaced, not used to
      # block every unrelated change until a replacement is chosen.
      - name: Dependency audit (shipped code)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Dependency audit (full tree)
        if: always()
        run: npm audit || true

      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-evidence
          path: docs/validation/evidence/
          retention-days: 90
